# Lint for the Python code. Errors that are real bugs are enforced; style is left to the formatter we do not use.
target-version = "py312"
line-length = 200
extend-exclude = ["frontend", "scripts/legacy_poster.py"]

[lint]
# E,F: pycodestyle errors and pyflakes (undefined names, unused imports, ...). B: likely bugs. S: security patterns.
select = ["E4", "E7", "E9", "F", "B", "S102", "S105", "S106", "S301", "S307", "S506", "S602", "S605"]
ignore = [
    "B008",  # FastAPI uses function calls in defaults (Depends, File, Form)
    "B904",  # `raise ... from` inside except: the handlers answer with HTTP errors on purpose
    "E701", "E702",
]

[lint.per-file-ignores]
"main.py" = ["E402"]  # load_dotenv() must run before the services are imported
"tests/*" = ["S", "B011", "B017", "E731"]
