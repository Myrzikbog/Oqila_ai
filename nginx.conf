# ==============================================================================
# nginx.conf — Reverse Proxy Template for Oqila AI Telegram Mini App
# ==============================================================================
#
# deploy.sh installs this file itself when WEBAPP_URL in .env names your domain
# (the placeholder your-domain.com is replaced). To do it by hand:
#
# 1. sudo cp nginx.conf /etc/nginx/sites-available/oqila-ai
# 2. Replace 'your-domain.com' with your actual domain or subdomain
# 3. sudo ln -s /etc/nginx/sites-available/oqila-ai /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 4. Free SSL certificate (REQUIRED for the Telegram WebApp):
#    sudo apt install -y certbot python3-certbot-nginx
#    sudo certbot --nginx -d your-domain.com
#
# After any change of the security headers below, open the Mini App in Telegram (phone and desktop) and in the
# browser's /admin: a too strict Content-Security-Policy shows up as a blank screen.
# ==============================================================================

# Sign-in is the only endpoint that creates accounts (and with them fresh AI quotas): 10 requests a minute per address.
# This zone lives in the http{} context: sites-enabled files are included there.
limit_req_zone $binary_remote_addr zone=oqila_login:10m rate=10r/m;

server {
    listen 80;
    server_name your-domain.com; # Замените на ваш домен или субдомен

    client_max_body_size 20M;

    # Security headers. The app has no WebSocket and no third-party scripts except Telegram's own SDK.
    # frame-ancestors lets Telegram Web embed the Mini App (the desktop and mobile clients do not use a frame).
    # The app sets Referrer-Policy and X-Content-Type-Options itself; they are hidden from the upstream below so that
    # every response carries each header exactly once, from here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    # Everything proxied to the app uses these (keep-alive to the upstream: no Connection header, HTTP/1.1)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/auth/login {
        limit_req zone=oqila_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI generation: one card is several model calls in a row, the default 60 s is not enough
    location ~ ^/api/(generate-card$|cards/\d+/) {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static & Compiled assets caching. A location with its own add_header drops the server-level ones: repeat them.
    location ~* ^/(assets|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
