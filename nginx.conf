# ==============================================================================
# nginx.conf — Reverse Proxy Template for Oqila AI Telegram Mini App
# ==============================================================================
#
# Instructions:
# 1. Copy this file to: /etc/nginx/sites-available/oqila-ai
#    sudo cp nginx.conf /etc/nginx/sites-available/oqila-ai
#
# 2. Replace 'your-domain.com' with your actual domain or subdomain:
#    sudo nano /etc/nginx/sites-available/oqila-ai
#
# 3. Enable site:
#    sudo ln -s /etc/nginx/sites-available/oqila-ai /etc/nginx/sites-enabled/
#    sudo nginx -t
#    sudo systemctl reload nginx
#
# 4. Issue free SSL Certificate with Certbot (REQUIRED for Telegram WebApp):
#    sudo apt install -y certbot python3-certbot-nginx
#    sudo certbot --nginx -d your-domain.com
# ==============================================================================

server {
    listen 80;
    server_name your-domain.com; # Замените на ваш домен или субдомен

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSockets & Connection upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable cache for live API endpoints
        proxy_cache_bypass $http_upgrade;
    }

    # Static & Compiled assets caching
    location ~* ^/(assets|static)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
